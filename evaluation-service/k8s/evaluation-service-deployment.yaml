apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-evaluation-service
  namespace: evaluation-service
  labels:
    app: evaluation-service
    instance: app-evaluation-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evaluation-service
      instance: app-evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
        instance: app-evaluation-service
    spec:
      serviceAccountName: evaluation-service-sa
      containers:
        - name: evaluation-service
          # image: evaluation-service:local # Local
          image: 370930247065.dkr.ecr.us-east-2.amazonaws.com/evaluation-service:latest # Nuvem
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - containerPort: 8004
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
          env:
            - name: PORT
              value: "8004"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap-evaluation-service
                  key: REDIS_URL
            - name: FLAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap-evaluation-service
                  key: FLAG_SERVICE_URL
            - name: TARGETING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap-evaluation-service
                  key: TARGETING_SERVICE_URL
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opaque-evaluation-service
                  key: SERVICE_API_KEY
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap-evaluation-service
                  key: AWS_SQS_URL
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: configmap-evaluation-service
                  key: AWS_REGION
            # Pode passar via IRSA (IAM Role for Service Account)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: opaque-evaluation-service
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opaque-evaluation-service
                  key: AWS_SECRET_ACCESS_KEY
