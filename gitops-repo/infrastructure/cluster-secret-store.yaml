# ============================================
# CLUSTER SECRET STORE: AWS Secrets Manager
# ============================================
# Conexão do External Secrets com o Secrets Manager, válida para todos os namespaces
# Sem bloco "auth": as credenciais vêm do EKS Pod Identity
# (role criada pelo Terraform no módulo external-secrets)
# ============================================

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
