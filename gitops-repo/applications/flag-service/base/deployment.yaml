# ============================================
# DEPLOYMENT: Flag Service
# ============================================
# Deployment base para o flag-service
# Gerenciado via GitOps (ArgoCD)
# ============================================

apiVersion: apps/v1
kind: Deployment

# ============================================
# METADATA
# ============================================
metadata:
  name: deployment-flag-service          # Nome do deployment (referenciado pelo HPA)
  labels:
    app: flag-service                    # Label principal da aplicação
    managed-by: gitops                   # Indica gerenciamento GitOps

# ============================================
# SPEC
# ============================================
spec:
  # Sem "replicas": a quantidade é controlada pelo HPA (hpa.yaml).
  # Se ficasse fixa aqui, o selfHeal do ArgoCD desfaria cada escala do HPA.

  # ============================================
  # SELECTOR
  # ============================================
  selector:
    matchLabels:
      app: flag-service                  # Seleciona pods com esta label
      instance: app-flag-service         # Diferencia dos pods do Job de init (que também têm app: flag-service)

  # ============================================
  # TEMPLATE DO POD
  # ============================================
  template:
    metadata:
      labels:
        app: flag-service                # Label aplicada aos pods
        instance: app-flag-service

    spec:
      # ============================================
      # CONTAINERS
      # ============================================
      containers:
      - name: flag-service               # Nome do container
        image: flag-service:v1.0.0       # Imagem base (será substituída pelo Kustomize)

        # ============================================
        # PORTAS
        # ============================================
        ports:
        - containerPort: 8002            # Porta da aplicação Python (gunicorn)
          name: http                     # Nome da porta

        # ============================================
        # VARIÁVEIS DE AMBIENTE
        # ============================================
        env:
        - name: PORT
          value: "8002"                  # Porta em que a aplicação escuta
        - name: DATABASE_URL             # postgres://...@<rds>:5432/flags_db (vem do ExternalSecret)
          valueFrom:
            secretKeyRef:
              name: opaque-flag-service
              key: DB_URL
        - name: AUTH_SERVICE_URL         # Valida as API keys no auth-service (vem do ConfigMap)
          valueFrom:
            configMapKeyRef:
              name: configmap-flag-service
              key: AUTH_SERVICE_URL

        # ============================================
        # RECURSOS
        # ============================================
        resources:
          requests:                      # Recursos mínimos garantidos
            memory: "128Mi"              # Memória mínima (Python usa mais que o Go do auth)
            cpu: "100m"                  # CPU mínima (0.1 core)
          limits:                        # Recursos máximos permitidos
            memory: "256Mi"              # Memória máxima
            cpu: "300m"                  # CPU máxima (0.3 core)

        # ============================================
        # LIVENESS PROBE
        # ============================================
        # Verifica se o container está vivo
        # Se falhar, Kubernetes reinicia o pod
        livenessProbe:
          httpGet:
            path: /health                # Endpoint de health check
            port: 8002                   # Porta do health check
          initialDelaySeconds: 10        # Aguarda 10s antes da primeira verificação
          periodSeconds: 15              # Verifica a cada 15s
          timeoutSeconds: 5              # Timeout de 5s por verificação
          failureThreshold: 3            # Reinicia após 3 falhas consecutivas

        # ============================================
        # READINESS PROBE
        # ============================================
        # Verifica se o container está pronto para receber tráfego
        # Se falhar, remove o pod do Service
        readinessProbe:
          httpGet:
            path: /health                # Endpoint de health check
            port: 8002                   # Porta do health check
          initialDelaySeconds: 5         # Aguarda 5s antes da primeira verificação
          periodSeconds: 10              # Verifica a cada 10s
          timeoutSeconds: 3              # Timeout de 3s por verificação
          failureThreshold: 3            # Remove do Service após 3 falhas

        # ============================================
        # SECURITY CONTEXT
        # ============================================
        # Configurações de segurança do container
        securityContext:
          allowPrivilegeEscalation: false  # Não permite escalação de privilégios
          runAsNonRoot: true               # Não executa como root
          runAsUser: 1000                  # UID do appuser criado no Dockerfile
          capabilities:
            drop:
            - ALL                          # Remove todas as capabilities Linux
