# ============================================
# SERVICE: Flag Service
# ============================================
# Expõe o flag-service dentro do cluster
# Usado pelos outros serviços em:
# http://svc-flag-service.flag-service.svc.cluster.local:80
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: svc-flag-service                 # Nome do service (mesmo da Fase 2)
  labels:
    app: flag-service
spec:
  type: ClusterIP                        # Acessível apenas dentro do cluster
  ports:
  - port: 80                             # Porta do service
    targetPort: 8002                     # Porta do container
    protocol: TCP
    name: http
  selector:
    app: flag-service                    # Envia tráfego para pods com estas labels
    instance: app-flag-service           # Só os pods do deployment, não os do Job de init
