# ============================================
# KUSTOMIZATION: Flag Service Base
# ============================================
# Configuração base do Kustomize
# Define recursos e labels comuns
# ============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- externalsecret.yaml                    # Secret vindo do AWS Secrets Manager (External Secrets)
- configmap.yaml                         # AUTH_SERVICE_URL
- deployment.yaml
- service.yaml
- ingress.yaml                           # Rota pública /flags no ingress-nginx
- hpa.yaml
- db-init-job.yaml

configMapGenerator:
- name: db-init-flag-service             # init.sql vira ConfigMap montado no Job
  files:
  - init.sql

commonLabels:
  app: flag-service
  managed-by: gitops
