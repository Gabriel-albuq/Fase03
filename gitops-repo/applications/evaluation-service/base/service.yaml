# ============================================
# SERVICE: Evaluation Service
# ============================================
# Expõe o evaluation-service dentro do cluster
# Usado pelos outros serviços em:
# http://svc-evaluation-service.evaluation-service.svc.cluster.local:80
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: svc-evaluation-service                 # Nome do service (mesmo da Fase 2)
  labels:
    app: evaluation-service
spec:
  type: ClusterIP                        # Acessível apenas dentro do cluster
  ports:
  - port: 80                             # Porta do service
    targetPort: 8004                     # Porta do container
    protocol: TCP
    name: http
  selector:
    app: evaluation-service                    # Envia tráfego para pods com estas labels
    instance: app-evaluation-service           # Só os pods do deployment, não os do Job de init
