# ============================================
# SERVICE: Analytics Service
# ============================================
# Expõe o analytics-service dentro do cluster
# Usado pelos outros serviços em:
# http://svc-analytics-service.analytics-service.svc.cluster.local:80
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: svc-analytics-service                 # Nome do service (mesmo da Fase 2)
  labels:
    app: analytics-service
spec:
  type: ClusterIP                        # Acessível apenas dentro do cluster
  ports:
  - port: 80                             # Porta do service
    targetPort: 8005                     # Porta do container
    protocol: TCP
    name: http
  selector:
    app: analytics-service                    # Envia tráfego para pods com estas labels
    instance: app-analytics-service           # Só os pods do deployment, não os do Job de init
