# ============================================
# JOB: Inicialização do banco do Targeting Service
# ============================================
# O Terraform cria o banco targeting_db vazio no RDS
# Este Job roda o init.sql (CREATE TABLE IF NOT EXISTS)
# Hook do ArgoCD: roda a cada sync, depois do Secret
# ============================================

apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-targeting-service
  annotations:
    argocd.argoproj.io/hook: Sync                              # Roda durante o sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation  # Apaga o Job anterior antes de criar o novo
    argocd.argoproj.io/sync-wave: "1"                          # Depois dos recursos da wave 0 (Secret)
spec:
  backoffLimit: 3                        # Até 3 tentativas
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:16-alpine        # Mesma versão major do RDS
        command: ["psql", "$(DATABASE_URL)", "-v", "ON_ERROR_STOP=1", "-f", "/sql/init.sql"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opaque-targeting-service
              key: DB_URL
        volumeMounts:
        - name: sql
          mountPath: /sql
      volumes:
      - name: sql
        configMap:
          name: db-init-targeting-service     # Gerado pelo configMapGenerator a partir do init.sql
