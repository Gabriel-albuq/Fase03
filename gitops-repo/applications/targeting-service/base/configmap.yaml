# ============================================
# CONFIGMAP: Targeting Service
# ============================================
# Configuração não sensível do targeting-service
# (credenciais do banco ficam no ExternalSecret)
# ============================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-targeting-service
data:
  # Service do auth-service, em outro namespace (por isso o FQDN)
  AUTH_SERVICE_URL: "http://svc-auth-service.auth-service.svc.cluster.local:80"
