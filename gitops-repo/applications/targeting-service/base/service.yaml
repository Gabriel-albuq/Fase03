# ============================================
# SERVICE: Targeting Service
# ============================================
# Expõe o targeting-service dentro do cluster
# Usado pelos outros serviços em:
# http://svc-targeting-service.targeting-service.svc.cluster.local:80
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: svc-targeting-service                 # Nome do service (mesmo da Fase 2)
  labels:
    app: targeting-service
spec:
  type: ClusterIP                        # Acessível apenas dentro do cluster
  ports:
  - port: 80                             # Porta do service
    targetPort: 8003                     # Porta do container
    protocol: TCP
    name: http
  selector:
    app: targeting-service                    # Envia tráfego para pods com estas labels
    instance: app-targeting-service           # Só os pods do deployment, não os do Job de init
