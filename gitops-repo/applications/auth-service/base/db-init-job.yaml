# ============================================
# JOB: Inicialização do banco do Auth Service
# ============================================
# O Terraform cria o banco auth_db vazio no RDS
# Este Job roda o init.sql (CREATE TABLE IF NOT EXISTS) e o api-keys.sql
# (cadastra o hash da API key do evaluation-service, gerada pelo Terraform)
# Hook do ArgoCD: roda a cada sync, depois do Secret
# ============================================

apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-auth-service
  annotations:
    argocd.argoproj.io/hook: Sync                              # Roda durante o sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation  # Apaga o Job anterior antes de criar o novo
    argocd.argoproj.io/sync-wave: "1"                          # Depois dos recursos da wave 0 (Secret)
spec:
  backoffLimit: 3                        # Até 3 tentativas
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:16-alpine        # Mesma versão major do RDS
        command: ["psql", "$(DATABASE_URL)", "-v", "ON_ERROR_STOP=1",
                  "-v", "evaluation_key_hash=$(EVALUATION_KEY_HASH)",
                  "-f", "/sql/init.sql", "-f", "/sql/api-keys.sql"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opaque-auth-service
              key: DB_URL
        - name: EVALUATION_KEY_HASH      # SHA-256 da SERVICE_API_KEY do evaluation (vem do ExternalSecret)
          valueFrom:
            secretKeyRef:
              name: opaque-auth-service
              key: EVALUATION_KEY_HASH
        volumeMounts:
        - name: sql
          mountPath: /sql
      volumes:
      - name: sql
        configMap:
          name: db-init-auth-service     # Gerado pelo configMapGenerator a partir do init.sql
