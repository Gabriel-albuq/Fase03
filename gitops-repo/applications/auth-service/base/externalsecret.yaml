# ============================================
# EXTERNAL SECRET: Auth Service
# ============================================
# Busca o segredo fase03-fiap/auth-service no AWS Secrets Manager
# e cria o Secret opaque-auth-service (DB_URL, MASTER_KEY)
# O segredo é criado pelo Terraform; nenhuma senha fica no Git
# ============================================

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opaque-auth-service
spec:
  refreshInterval: 1h                    # Relê o Secrets Manager a cada 1h (pega senhas trocadas)

  # ============================================
  # STORE
  # ============================================
  secretStoreRef:
    name: aws-secretsmanager             # ClusterSecretStore (gitops-repo/infrastructure)
    kind: ClusterSecretStore

  # ============================================
  # TARGET
  # ============================================
  target:
    name: opaque-auth-service            # Nome do Secret criado (usado no deployment e no Job)
    creationPolicy: Owner                # Secret é apagado junto com o ExternalSecret

  # ============================================
  # DATA
  # ============================================
  # Cada chave do JSON no Secrets Manager vira uma chave do Secret
  dataFrom:
  - extract:
      key: fase03-fiap/auth-service
