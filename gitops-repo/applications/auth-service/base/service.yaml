# ============================================
# SERVICE: Auth Service
# ============================================
# Expõe o auth-service dentro do cluster
# Usado pelos outros serviços em:
# http://svc-auth-service.auth-service.svc.cluster.local:80
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: svc-auth-service                 # Nome do service (mesmo da Fase 2)
  labels:
    app: auth-service
spec:
  type: ClusterIP                        # Acessível apenas dentro do cluster
  ports:
  - port: 80                             # Porta do service
    targetPort: 8001                     # Porta do container
    protocol: TCP
    name: http
  selector:
    app: auth-service                    # Envia tráfego para pods com estas labels
    instance: app-auth-service           # Só os pods do deployment, não os do Job de init
