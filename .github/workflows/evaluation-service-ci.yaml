# evaluation-service-ci.yaml
# CI do evaluation-service: roda em PR e em push na main, só quando a pasta do serviço muda

name: evaluation-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yaml"
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yaml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: evaluation-service # Mesmo nome criado pelo módulo ecr do Terraform

# Todos os comandos rodam dentro da pasta do serviço
defaults:
  run:
    working-directory: evaluation-service

jobs:
  # ==========================================================================
  # Job 1: Build & Unit Test
  build-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: evaluation-service/go.sum

      - name: 🏗️ Build
        run: go build ./...

      - name: 🧪 Test
        run: go test -v ./...

  # ==========================================================================
  # Job 2: Linter / Static Analysis
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: evaluation-service/go.sum

      # Histórico: o lint barrou dois problemas no evaluator.go, corrigidos no código (sem exceção aqui):
      # - errcheck: o erro do RedisClient.Set(...).Err() era ignorado; agora uma falha no cache é registrada no log
      # - staticcheck SA1019: "io/ioutil" está obsoleto desde o Go 1.16; trocado por io.ReadAll, que faz o mesmo
      - name: 🔍 golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: evaluation-service
          # Exceção do errcheck só para json.NewEncoder(w).Encode(...) nos handlers HTTP:
          # o Encode retorna um erro que o código não verifica, e o lint alertava isso.
          # Ignoramos porque o status já foi enviado antes do Encode, então não há como avisar o cliente.
          # O errcheck continua valendo para todo o resto (Redis, SQS, chamadas HTTP etc.)
          args: --exclude 'Error return value of .\(\*encoding/json\.Encoder\)\.Encode. is not checked'

  # ==========================================================================
  # Job 3: Security Scan (SCA + SAST) - vulnerabilidade crítica bloqueia a pipeline
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: evaluation-service/go.sum

      # SCA: CVEs nas dependências do go.mod
      - name: 📦 SCA - Trivy
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.56.2 \
            fs --scanners vuln --severity CRITICAL --exit-code 1 --no-progress /src

      # SAST: padrões inseguros no código
      - name: 🔐 SAST - gosec
        if: ${{ !cancelled() }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.18.2
          gosec -severity high -confidence medium ./...

  # ==========================================================================
  # Job 4: Docker Build & Push - no PR só build + scan; push no ECR só em push na main
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: security
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }} # Usado depois pelo job de GitOps

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECR_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔓 Login to Amazon ECR
        id: ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECR_PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Set image tag
        id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🐳 Docker build
        run: docker build --platform linux/amd64 -t "$ECR_REPOSITORY:${{ steps.tag.outputs.tag }}" .

      # Container scan: CVEs no sistema da imagem (alpine) e no binário
      - name: 🔎 Container scan - Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity CRITICAL --exit-code 1 --no-progress "$ECR_REPOSITORY:${{ steps.tag.outputs.tag }}"

      - name: 📤 Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECR_PUSH == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker tag "$ECR_REPOSITORY:$TAG" "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "Imagem enviada: \`$REGISTRY/$ECR_REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # JOB 5: Pipeline Summary
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-test, lint, security, docker]
    if: always()

    # Sem checkout a pasta evaluation-service não existe, então este job roda na raiz
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: 📊 Complete Pipeline Summary
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
          BUILD: ${{ needs.build-test.result }}
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          DOCKER: ${{ needs.docker.result }}
          PUSHED: ${{ needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECR_PUSH == 'true' }}
        run: |
          # Resultado real do job -> ícone
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *) echo "⏹️" ;;
            esac
          }

          if [ "$PUSHED" = "true" ]; then
            STATUS="🎉 **READY - Image pushed to ECR**"
          elif [ "$DOCKER" = "success" ]; then
            STATUS="🔍 **VALIDATED - Image built and scanned, not pushed (PR or ENABLE_ECR_PUSH off)**"
          else
            STATUS="🚫 **FAILED - Pipeline stopped before publishing the image**"
          fi

          echo "## 🚀 CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. 🔨 **Build & Test:** $(icon "$BUILD") $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "2. 🧹 **Lint:** $(icon "$LINT") $LINT" >> $GITHUB_STEP_SUMMARY
          echo "3. 🛡️ **Security Scan:** $(icon "$SECURITY") $SECURITY" >> $GITHUB_STEP_SUMMARY
          echo "4. 🐳 **Docker Build & Push:** $(icon "$DOCKER") $DOCKER" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$ECR_REPOSITORY:${IMAGE_TAG:-not built}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
